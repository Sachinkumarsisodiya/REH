<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nav-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="nav-text-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Standalone Borderless Monogram REH -->
  <g transform="translate(10, 15)">
    <!-- Letter R -->
    <path d="M 0 0 V 70 M 0 0 H 28 C 45 0, 48 16, 48 26 C 48 36, 40 42, 28 42 H 0 M 28 42 L 48 70" 
          fill="none" stroke="#0D9488" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Letter E with Integrated Eye Pupil Motif -->
    <g transform="translate(52, 0)">
      <path d="M 8 0 V 70 M 8 0 H 42 M 8 70 H 42" fill="none" stroke="#06B6D4" stroke-width="9" stroke-linecap="round"/>
      <!-- Optical Lens Pupil in center of E -->
      <circle cx="28" cy="35" r="15" fill="none" stroke="url(#nav-teal)" stroke-width="6"/>
      <circle cx="28" cy="35" r="6" fill="#38BDF8"/>
      <circle cx="30" cy="33" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Letter H -->
    <g transform="translate(104, 0)">
      <path d="M 8 0 V 70 M 42 0 V 70 M 8 35 H 42" 
            fill="none" stroke="#0F172A" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Hospital Title Typography -->
  <g transform="translate(175, 10)">
    <text x="0" y="44" font-family="Outfit, Inter, system-ui, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="-0.5">
      REKHA <tspan fill="url(#nav-text-teal)">EYE HOSPITAL</tspan>
    </text>
    <text x="0" y="68" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#64748B" letter-spacing="2">
      SUPER SPECIALTY &amp; LASIK CENTER
    </text>
  </g>
</svg>
