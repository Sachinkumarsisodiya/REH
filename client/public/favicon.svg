<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mark-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Standalone Borderless REH Monogram -->
  <g transform="translate(66, 140)">
    
    <!-- Letter R -->
    <path d="M 0 0 V 230 M 0 0 H 65 C 115 0, 125 45, 125 75 C 125 105, 105 125 65 125 H 0 M 65 125 L 125 230" 
          fill="none" stroke="#0D9488" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Letter E with Integrated Eye Lens Contour -->
    <g transform="translate(130, 0)">
      <!-- Top & Bottom bars -->
      <path d="M 25 0 V 230 M 25 0 H 125 M 25 230 H 125" fill="none" stroke="#06B6D4" stroke-width="26" stroke-linecap="round"/>
      
      <!-- Central Eye Lens & Pupil in place of E's middle bar -->
      <circle cx="80" cy="115" r="48" fill="none" stroke="url(#mark-teal)" stroke-width="18" filter="url(#mark-glow)"/>
      <circle cx="80" cy="115" r="20" fill="#38BDF8"/>
      <circle cx="87" cy="107" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Letter H -->
    <g transform="translate(285, 0)">
      <path d="M 25 0 V 230 M 125 0 V 230 M 25 115 H 125" 
            fill="none" stroke="#0F172A" class="dark-stroke-white" stroke-width="26" stroke-linecap="round"/>
    </g>

  </g>
</svg>